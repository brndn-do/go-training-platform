# Config for KataGo's C++ Analysis engine ("./katago analysis"), tuned for this project's
# actual deployment target: Eigen (pure CPU) backend, 4 vCPU, Azure Container Apps
# consumption plan (scale-to-zero). Derived from the upstream analysis_example.cfg
# (engine/katago/, gitignored/vendored) rather than copying it wholesale — several of its
# defaults assume a GPU and would misbehave or exceed this container's memory budget.
#
# Design assumptions baked into the values below:
#   - No search by default: maxVisits = 1 for any query that doesn't specify its own.
#   - Synchronous: Engine.Api sends one query at a time and awaits its response before
#     sending the next. There is never more than one query in flight.
# A query that needs real search (e.g. a stronger bot strength) overrides maxVisits itself
# via the JSON "maxVisits" field — this file only sets the default for queries that don't.

# Logs------------------------------------------------------------------------------------

logToStderr = true
logAllRequests = true
logAllResponses = true
logErrorsAndWarnings = true

# Analysis------------------------------------------------------------------------------------

# Fixes winrate reporting to Black's perspective regardless of whose turn it is or who asked —
# required for EngineSuggestion.BlackWinRate's contract (Application layer).
reportAnalysisWinratesAs = BLACK

# Defaults to 0.04, which deliberately spreads search visits across weaker moves too — meant
# for producing an analysis report of many candidates. Every query here instead wants a single
# best move (to actually play, or to suggest as a hint), so disable that spread. Only affects
# real search (moveInfos); has no effect on the pre-search "policy" field used by the 1-visit
# proportional-sampling lane.
wideRootNoise = 0.0

# Search limits-----------------------------------------------------------------------------------

# Default cap on visits per query, when a query doesn't specify its own.
maxVisits = 1

# Search threads, batching--------------------------------------------------------------------------

# Only one query is ever in flight (Engine.Api is synchronous), so there is only ever one
# position to search — no benefit to searching multiple positions in parallel.
numAnalysisThreads = 1

# With maxVisits = 1, a single query's search is one playout total. Multiple threads racing
# for that one playout only adds synchronization overhead, never speed.
numSearchThreadsPerAnalysisThread = 1

# Only one query is ever in flight, so only one position is ever waiting for an NN eval at a
# time — no batching will ever actually occur.
nnMaxBatchSize = 1

# Cache up to 2 ** this many neural net evaluations (~1.5KB each) in case of transpositions
# or repeated positions across queries. 2^18 * 1.5KB =~ 390MB — the upstream example's
# default (2^23 =~ 12.9GB) alone exceeds this container's entire 8GB budget. Revisit this
# number once real memory usage (model weights + cache + everything else) is measured.
nnCacheSizePowerOfTwo = 18

# Eigen-specific settings--------------------------------------
# These only apply when using the Eigen (pure CPU) version of KataGo.

# CPU threads for evaluating the neural net itself. This does NOT default from vCPU count —
# it defaults to min(numAnalysisThreads * numSearchThreadsPerAnalysisThread, numCPUCores),
# which with the values above would silently collapse to 1 and leave 3 of the 4 vCPUs idle.
# Set explicitly to actually parallelize the one NN forward pass per query across all 4 cores.
numEigenThreadsPerModel = 4
