# frontend/ is intentionally not a service here — run it locally with `npm run dev`
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    environment:
      KataGoProcess__ExecutablePath: katago/squashfs-root/AppRun
      KataGoProcess__ModelPath: models/${KATAGO_MODEL_FILE}
      KataGoProcess__HumanModelPath: models/${KATAGO_HUMAN_MODEL_FILE}
      KataGoProcess__ConfigPath: config/go_training_platform_config.cfg
    ports:
      - "${ENGINE_PORT:-5100}:8080"
    # Matches the Azure Container Apps Consumption plan's per-container maximum
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Engine__BaseUrl: http://engine:8080
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    # Mirrors what the backend requests on Azure Container Apps.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

volumes:
  postgres-data:
