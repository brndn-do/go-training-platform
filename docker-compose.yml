# backend/Dockerfile referenced below doesn't exist yet, so `up backend` fails to build
# frontend/ is intentionally not a service here — run it locally with `npm run dev`
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    environment:
      KataGoProcess__ExecutablePath: katago/squashfs-root/AppRun
      KataGoProcess__ModelPath: models/kata1-zhizi-b40c768nbt-s11272M-d5935M.bin.gz
      KataGoProcess__HumanModelPath: models/b18c384nbt-humanv0.bin.gz
      KataGoProcess__ConfigPath: config/go_training_platform_config.cfg
    ports:
      - "${ENGINE_PORT:-5100}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${Jwt__Secret}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Engine__BaseUrl: http://engine:8080
    ports:
      - "${BACKEND_PORT:-5000}:8080"

volumes:
  postgres-data:
