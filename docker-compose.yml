# backend/Dockerfile referenced below doesn't exist yet, so `up backend` fails to build
# frontend/ is intentionally not a service here — run it locally with `npm run dev`
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    environment:
      # These paths are container-relative (the image's WORKDIR is /app). The
      # KataGoProcess__* values in .env are host-absolute, for running the engine outside
      # Docker, so they are deliberately not reused here — only the file names are shared.
      # Override a name in .env if you downloaded a different net or renamed the config.
      KataGoProcess__ExecutablePath: katago/squashfs-root/AppRun
      KataGoProcess__ModelPath: models/${KATAGO_MODEL_FILE:-kata1-zhizi-b40c768nbt-s11272M-d5935M.bin.gz}
      KataGoProcess__HumanModelPath: models/${KATAGO_HUMAN_MODEL_FILE:-b18c384nbt-humanv0.bin.gz}
      KataGoProcess__ConfigPath: config/${KATAGO_CONFIG_FILE:-go_training_platform_config.cfg}
    ports:
      - "${ENGINE_PORT:-5100}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      # KataGo loads its net before /health/ready passes — a minute or more on a CPU-only
      # build. Failures inside start_period don't count against retries.
      start_period: 180s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Engine__BaseUrl: http://engine:8080
      # Until auth ships, ICurrentPlayer is registered only under IsDevelopment(), and
      # ValidateOnBuild fails the host at Build() anywhere else.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      CurrentPlayer__Id: ${CurrentPlayer__Id}
    ports:
      - "${BACKEND_PORT:-5000}:8080"

volumes:
  postgres-data:
